# [C17] CI — lint, build i testy reguł Firestore na każdy push/PR do main.
# Testy reguł (tests/rules/) wymagają emulatora Firestore (Java 21).
# Lokalnie na Windows emulator może nie wystartować (AV blokuje loopback Javy)
# — wtedy ten workflow jest jedynym miejscem weryfikacji reguł.
name: CI

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Testy czystej logiki (Vitest, src/**/*.test.ts) — bitwy, statystyki, tarcze.
      - run: npm test
      - run: npm run build
      # [CI BRAMKA] Deploy wysyła DOKŁADNIE ten build, który przeszedł lint
      # i testy — bez drugiego budowania w jobie deploy.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 1

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm run test:rules

  # [C42] Auto-deploy reguł Firestore + Firebase Hosting (grot-x.web.app) po
  # każdym merge do main — bez terminala. BRAMKA: tylko gdy lint, testy logiki,
  # build i testy reguł zielone; wysyła przetestowany build (artefakt `dist`).
  # Ręczny deploy z komputera pilnuje hook predeploy (scripts/predeploy-check.mjs).
  # Wymaga sekretu FIREBASE_SERVICE_ACCOUNT (JSON konta usługi z rolą
  # Firebase Hosting Admin). Bez sekretu job kończy się ostrzeżeniem, nie błędem.
  deploy-hosting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-build, rules-tests]
    runs-on: ubuntu-latest
    # [CI BRAMKA] Jeden deploy naraz, po kolei — przy dwóch szybkich pushach
    # starszy build nie nadpisze nowszego. Czekający deploy zastępuje nowszy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check secret
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Brak sekretu FIREBASE_SERVICE_ACCOUNT — pomijam deploy na Firebase Hosting."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secret.outputs.ok == 'true'
      - uses: actions/download-artifact@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          name: dist
          path: dist
      # Reguły Firestore przed hostingiem (nowy kod może ich wymagać).
      # Konto usługi potrzebuje ról: Firebase Rules Admin + Service Usage Consumer.
      - name: Deploy Firestore rules
        if: steps.secret.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase deploy --only firestore:rules --project grotx-fb8f8 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.secret.outputs.ok == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: grotx-fb8f8
          channelId: live
