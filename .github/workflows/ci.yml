# [C17] CI — lint, build i testy reguł Firestore na każdy push/PR do main.
# Testy reguł (tests/rules/) wymagają emulatora Firestore (Java 21).
# Lokalnie na Windows emulator może nie wystartować (AV blokuje loopback Javy)
# — wtedy ten workflow jest jedynym miejscem weryfikacji reguł.
#
# [MINUTY 2026-11-02] Repo prywatne = 2000 darmowych minut/mies. Dlatego JEDEN
# job (GitHub zaokrągla każdy job w górę do pełnej minuty, a npm ci szło 3×)
# i bez przebiegów dla samych notatek (*.md, _wip-patches).
name: CI

on:
  push:
    branches: [main, 'chore/**']
    paths-ignore:
      - '**.md'
      - '_wip-patches/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '_wip-patches/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    # [CI BRAMKA] Na main jeden przebieg naraz, po kolei — przy dwóch szybkich
    # pushach starszy build nie nadpisze nowszego. Inne gałęzie/PR bez kolejki.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'deploy-production' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      # Testy czystej logiki (Vitest, src/**/*.test.ts) — bitwy, statystyki, tarcze.
      - run: npm test
      - run: npm run build
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm run test:rules

      # [E2E 2026-11-05] Całe ścieżki w Chromium (widok telefonu) na emulatorach
      # Auth + Firestore (projekt demo-grotx, zero kontaktu z produkcją).
      # Bramka jak wyżej: czerwony test = brak deployu. ~1–1,5 min na przebieg.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Raport e2e (tylko przy błędzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # [C42] Auto-deploy reguł Firestore + Firebase Hosting (grot-x.web.app) po
      # każdym push do main. BRAMKA: kroki niżej ruszają tylko, gdy lint, testy
      # logiki, build i testy reguł powyżej przeszły; wysyłają TEN SAM build.
      # Ręczny deploy z komputera pilnuje hook predeploy (scripts/predeploy-check.mjs).
      # Wymaga sekretu FIREBASE_SERVICE_ACCOUNT (JSON konta usługi z rolą
      # Firebase Hosting Admin). Bez sekretu krok kończy się ostrzeżeniem, nie błędem.
      - name: Check secret
        id: secret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Brak sekretu FIREBASE_SERVICE_ACCOUNT — pomijam deploy na Firebase Hosting."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Reguły Firestore przed hostingiem (nowy kod może ich wymagać).
      # Konto usługi potrzebuje ról: Firebase Rules Admin + Service Usage Consumer.
      - name: Deploy Firestore rules
        if: steps.secret.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase deploy --only firestore:rules --project grotx-fb8f8 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.secret.outputs.ok == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: grotx-fb8f8
          channelId: live
