<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- [FIX 19.04.2026] Zmienione z "black-translucent" na "black".
         "black-translucent" każe iOS PWA rysować treść POD paskiem statusu,
         co na niektórych urządzeniach (zwłaszcza Android PWA gdzie
         env(safe-area-inset-top) zwraca 0) powodowało że zegarek/bateria
         systemowa zasłaniały nagłówek. "black" = pasek nieprzezroczysty,
         app startuje poniżej. theme-color poniżej nadaje mu kolor tła. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="GROT-X" />
    <meta name="theme-color" content="#0a3a2a" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    
    <!-- [C20] Zoom odblokowany (dostępność — WCAG wymaga możliwości powiększenia;
         user-scalable=no blokował np. starszych trenerów). iOS i tak ignoruje
         maximum-scale przy gestach systemowych. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- [RODO/DE 11.06.2026] Material Symbols self-hosted zamiast
         fonts.googleapis.com (wyrok LG München: CDN Google Fonts przekazuje
         IP do Google bez zgody). @font-face w src/tailwind.css. -->
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Szybszy pierwszy start dnia: DNS+TLS do backendów Firebase/reCAPTCHA
         zestawiane równolegle z pobieraniem JS, zamiast dopiero przy pierwszym
         requeście auth/Firestore. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://www.google.com" />

    <!-- Zielone tło od pierwszej klatki: zanim dojedzie CSS i zamontuje się
         React, ekran ma kolor splasha PWA (#0a3a2a) zamiast białego błysku.
         Po załadowaniu CSS klasa bg-gray-100 na <body> nadpisuje regułę
         elementową, a #root przestaje być :empty po mount. -->
    <style>
      body { background: #0a3a2a; }
      #root:empty { min-height: 100vh; background: #0a3a2a; }
    </style>

    <title>GROT-X</title>
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-gray-100">
    <!-- [C20] Anty-flash dark mode — patrz public/theme-init.js (CSP blokuje inline) -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
